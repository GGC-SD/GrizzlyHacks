<head>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet"
  >
</head>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <!-- Logo -->
    <a class="navbar-brand" routerLink="/home">
      <picture>
        <img src="/assets/logo.png" class="img-fluid" width="100" height="100" alt="GGC Logo">
      </picture>
    </a>

    <!-- Mobile Menu Toggle -->
    <button
      class="navbar-toggler text-white"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navmenu"
    >
      <i class="bi bi-list" style="font-size: 1.5rem;"></i>
    </button>

    <!-- Nav Links -->
    <div class="collapse navbar-collapse" id="navmenu">
      <ul class="navbar-nav ms-auto text-end w-100">

        <!-- Home -->
        <li class="nav-item">
          <button class="btn btn-sm" routerLink="/home">Home</button>
        </li>

        <!-- Overview (Public) -->
        <!--li class="nav-item">
          <button class="btn btn-sm" routerLink="/overview">Hackathon</button>
        </li-->

        <!-- View Schedule (Public) -->
        <!--li class="nav-item">
          <button class="btn btn-sm " type="button" routerLink="/timeline">View Schedule</button>
        </li-->

        <!-- Registration (Public) -->
        <li class="nav-item">
          <button
            class="btn-primary btn-lg"
            type="button"
            (click)="openExternalLink('https://cglink.me/2rV/r387555')">
            Registration
          </button>
        </li>

        <!-- Schedule/booklet (Public) -->
        <li class="nav-item">
          <button
            class="btn-primary btn-lg"
            type="button"
            (click)="openExternalLink('https://canva.link/ofsngwuvef7txsk')">
            Schedule
          </button>
        </li>
        
        <!-- Submit Project to Devpost (Public) -->
        <li class="nav-item">
          <button
            class="btn-primary btn-lg"
            type="button"
            (click)="openExternalLink('https://hack-ggc-vi.devpost.com/')">
            Submit Project
          </button>
        </li>
        
        <!-- Events (Public) -->
        <li class="nav-item">
          <button class="btn btn-sm" routerLink="/blogHome">Past Events</button>
        </li>
        
        <!-- Admin Dashboard (Admin Only) -->
        <li class="nav-item" *ngIf="auth.user && auth.adminLevel > 0">
          <button class="btn btn-sm" routerLink="/admin">Admin Dashboard</button>
        </li>

        <!-- Log In -->
        <li class="nav-item" *ngIf="!auth.user">
          <button class="btn btn-sm" (click)="router.navigate(['login'])">Log In</button>
        </li>

        <!-- Sign Out -->
        <li class="nav-item" *ngIf="auth.user">
          <button class="btn btn-sm" (click)="signOut()">Sign Out</button>
        </li>

      </ul>
    </div>
  </div>
</nav>

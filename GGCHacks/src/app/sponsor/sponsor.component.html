<div class="sponsor-section">
  <h2>Our Sponsors!</h2>

  <ng-container *ngIf="sponsorsLoaded; else loadingSponsors">
    <ng-container *ngIf="sponsors.length > 0; else noSponsors">
      <div class="sponsor-row">
        <div class="sponsor-item" *ngFor="let sponsor of sponsors">
          <a *ngIf="sponsor.link" [href]="sponsor.link" target="_blank">
            <img [src]="sponsor.imagePath" [alt]="sponsor.name" class="sponsor-logo">
          </a>
          <img *ngIf="!sponsor.link" [src]="sponsor.imagePath" [alt]="sponsor.name" class="sponsor-logo">
        </div>
      </div>
    </ng-container>
  </ng-container>

  <ng-template #loadingSponsors>
    <p>Loading sponsors...</p>
  </ng-template>

  <ng-template #noSponsors>
    <p>No sponsors available.</p>
  </ng-template>
</div>

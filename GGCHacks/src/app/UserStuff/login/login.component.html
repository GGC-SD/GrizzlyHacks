<div class="everything p-0">
  <div class="row justify-content-center pt-lg-5">
    <div class="card">
      <div>
        <div class="card-title">
          <h5>Log In!</h5>
        </div>
        <div class="card-body">
          <div *ngIf="!passwordReset">
            <div class="row">
              <div class="col">
                <div class="form-group">
                  <label>Email</label>
                  <input #email class="form-control" type="email" />
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col">
                <div class="form-group">
                  <label>Password</label>
                  <input #password type="password" class="form-control" />
                  <p (click)="passwordReset = true" id="link">Reset Password</p>
                </div>
              </div>
            </div>
            <div class="row justify-content-center">
              <button type="button" class="btn-primary"
                (click)="loginUser(email.value, password.value)"
                [disabled]="isLoginButtonUnusable">
                Login
              </button>
            </div>
          </div>

          <div *ngIf="passwordReset">
            <p> Email</p>
            <input class="form-control" #resetEmail />
            <button class="btn-primary" (click)="auth.passwordRecovery(resetEmail.value)">
              Reset Password
            </button>
            <button class="btn-primary" (click)="passwordReset = false">Back</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>

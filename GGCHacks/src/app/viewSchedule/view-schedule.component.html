<section class="view-schedule-section">
  <ng-container *ngIf="!flyerLoaded; else flyerContent">
    <div class="flyer-loading-placeholder">
      <div class="skeleton flyer-skeleton"></div>
      <div class="loading-placeholder">
        <div class="skeleton event-skeleton"></div>
        <div class="skeleton event-skeleton"></div>
        <div class="skeleton event-skeleton"></div>
      </div>
    </div>
  </ng-container>

  <ng-template #flyerContent>
    <div class="flyer-container" *ngIf="flyer">
      <div class="flyer-header">
        <img
          [src]="flyer.imagePath"
          alt="Flyer"
          class="flyer-image clickable"
          (click)="openFlyerModal(flyer)"
        >
        <h1 class="flyer-title">{{ flyer.name }}</h1>
      </div>

      <div class="flyer-schedule" *ngIf="events?.length > 0">
        <div *ngFor="let event of events" class="schedule-item">
          <div class="time">
            {{ event.startTime.toDate() | date: 'shortTime' }} -
            {{ event.endTime.toDate() | date: 'shortTime' }}
          </div>
          <div class="details">
            <h3>{{ event.title }}</h3>
            <p *ngIf="event.location">{{ event.location }}</p>
            <p *ngIf="event.description">{{ event.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
</section>

<div class="flyer-modal" *ngIf="selectedFlyer" (click)="closeFlyerModal()">
  <div class="flyer-modal-content" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeFlyerModal()">&times;</button>
    <img [src]="selectedFlyer.imagePath" alt="Flyer Preview">
  </div>
</div>
